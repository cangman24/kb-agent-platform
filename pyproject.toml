# ---------------------------------------------------------------------------
# pyproject.toml
#
# ★ 依赖分层是本文件最重要的设计（不是随手列一串包名）：
#
#     （无依赖）  -> core/ 12 个模块全部纯标准库
#     llm         -> 真机接 DeepSeek（openai SDK，延迟导入）
#     serve       -> FastAPI / uvicorn（HTTP 与 SSE）
#     dev         -> 测试与工具链
#
#   依据（实测）：全部单测**不需要任何第三方包**，约 1 秒跑完。
#   所以 CI 里 `python -m unittest discover` 就能跑完全部 345 项测试，
#   不需要装任何东西 —— 这是"业务逻辑与外部依赖解耦"换来的直接收益。
#
#   安装方式：
#     pip install -e .            # 只装运行时最小集（离线可用）
#     pip install -e ".[llm]"     # 接真模型
#     pip install -e ".[serve]"   # 起 HTTP 服务
#     pip install -e ".[dev]"     # 测试与工具
# ---------------------------------------------------------------------------
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-agent-platform"
version = "0.1.0"
description = "受控知识库 Agent：路由白名单、熔断与重试、Checkpoint 续跑、三层记忆与上下文压缩、SSE 流式轨迹、事后审计"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "刘丰硕" }]
keywords = ["agent", "llm", "tool-calling", "checkpoint", "sse", "memory", "guardrail"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# 运行时最小依赖：core/ 一个都不需要，这里只列"几乎总会用到"的
dependencies = []

[project.optional-dependencies]
# 真机：DeepSeek function calling（openai SDK 兼容协议）
llm = [
    "openai>=1.51,<2",
    "python-dotenv>=1.0",
]

# HTTP 服务层（FastAPI + SSE）
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
]

# 测试与工具链
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/cangman24/kb-agent-platform"

# ---------------------------------------------------------------------------
# 打包：只收 core 与应用包，排除 demos / tests / data
# ---------------------------------------------------------------------------
[tool.setuptools]
packages = ["core", "kb_agent"]

# ---------------------------------------------------------------------------
# 工具链配置
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# 全部测试约 1 秒（C 盘实测）。超过 30 秒说明有人引入了网络或模型调用，
# 应当失败而不是慢慢跑 —— 这条是在守护"离线可测"这条架构边界。
timeout = 30
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["data", "reports", ".git"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",   # 行长由 formatter 处理，中文注释难对齐
    "B008",   # 允许函数默认值里调用（本项目大量用 dataclass field 与注入）
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]          # 测试里允许 assert False 之类

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true     # fastapi / openai 都是可选依赖
exclude = ["data/", "reports/"]
